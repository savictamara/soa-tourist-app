syntax = "proto3";

package followerrpc;

service FollowerRpc {
  rpc FollowUser(FollowUserRequest) returns (FollowResponse);
  rpc UnfollowUser(UnfollowUserRequest) returns (UnfollowResponse);
  rpc GetRecommendations(GetRecommendationsRequest) returns (RecommendationsResponse);
}

message FollowUserRequest {
  string followerId = 1;
  string followingId = 2;
  string followerUsername = 3;
  string followingUsername = 4;
  string followerRole = 5;
  string followingRole = 6;
}

message FollowResponse {
  bool success = 1;
  string message = 2;
}

message UnfollowUserRequest {
  string followerId = 1;
  string followingId = 2;
}

message UnfollowResponse {
  bool success = 1;
  string message = 2;
}

message GetRecommendationsRequest {
  string userId = 1;
}

message UserMessage {
  string userId = 1;
  string username = 2;
  string role = 3;
}

message RecommendationsResponse {
  repeated UserMessage recommendations = 1;
}
