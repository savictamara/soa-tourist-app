syntax = "proto3";

package followerrpc;

service FollowerRpc {
  rpc CanComment(CanCommentRequest) returns (CanCommentResponse);
  rpc GetFollowedAuthors(GetFollowedAuthorsRequest) returns (GetFollowedAuthorsResponse);
}

message CanCommentRequest {
  int64 commenterId = 1;
  int64 authorId = 2;
}

message CanCommentResponse {
  bool allowed = 1;
}

message GetFollowedAuthorsRequest {
  int64 userId = 1;
}

message GetFollowedAuthorsResponse {
  repeated int64 authorIds = 1;
}
