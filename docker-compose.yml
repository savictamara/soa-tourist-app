services:
  stakeholders-db:
    image: postgres:16-alpine
    container_name: stakeholders-db
    restart: always
    environment:
      POSTGRES_DB: stakeholders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - stakeholders-db-data:/var/lib/postgresql/data
      - ./seed/stakeholders-init-data.sql:/tmp/stakeholders-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stakeholders_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    networks:
      - database

  blog-db:
    image: postgres:16-alpine
    container_name: blog-db
    restart: always
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - blog-db-data:/var/lib/postgresql/data
      - ./seed/blog-init-data.sql:/tmp/blog-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blog_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"
    networks:
      - database

  tour-mongo:
    image: mongo:7
    container_name: tour-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - tour-mongo-data:/data/db
    networks:
      - database

  follower-neo4j:
    image: neo4j:5
    container_name: follower-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - follower-neo4j-data:/data
    networks:
      - database

  stakeholders-service:
    build:
      context: .
      dockerfile: services/stakeholders-service/Dockerfile
      target: final
    container_name: stakeholders-service
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=stakeholders-db;Port=5432;Database=stakeholders_db;Username=postgres;Password=postgres
    depends_on:
      stakeholders-db:
        condition: service_healthy
    networks:
      - application
      - database

  blog-service:
    build:
      context: .
      dockerfile: services/blog-service/Dockerfile
      target: final
    container_name: blog-service
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=blog-db;Port=5432;Database=blog_db;Username=postgres;Password=root
      FollowerService__BaseUrl: http://follower-service:8086
    depends_on:
      blog-db:
        condition: service_healthy
      follower-service:
        condition: service_started
    networks:
      - application
      - database

  tour-service:
    build:
      context: .
      dockerfile: services/tour-service/Dockerfile
    container_name: tour-service
    restart: on-failure
    environment:
      MONGO_URI: mongodb://tour-mongo:27017
    depends_on:
      - tour-mongo
    networks:
      - application
      - database

  follower-service:
    build: ./services/follower-service
    container_name: follower-service
    environment:
      - SPRING_NEO4J_URI=bolt://follower-neo4j:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=password123
    depends_on:
      - follower-neo4j
    networks:
      - application
      - database

  api-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:80"
    depends_on:
      - stakeholders-service
      - blog-service
      - tour-service
      - follower-service
    networks:
      - application

  tourist-app-ui:
    build:
      context: ./frontend/tourist-app-ui
      dockerfile: Dockerfile
    container_name: tourist-app-ui
    ports:
      - "4200:4200"
    depends_on:
      - api-gateway
    networks:
      - application

volumes:
  stakeholders-db-data:
  blog-db-data:
  tour-mongo-data:
  follower-neo4j-data:

networks:
  application:
  database:
