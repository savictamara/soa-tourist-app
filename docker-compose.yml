services:
  stakeholders-db:
    image: postgres:16-alpine
    container_name: stakeholders-db
    restart: always
    environment:
      POSTGRES_DB: stakeholders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - stakeholders-db-data:/var/lib/postgresql/data
      - ./seed/stakeholders-init-data.sql:/tmp/stakeholders-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stakeholders_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    networks:
      - database

  blog-db:
    image: postgres:16-alpine
    container_name: blog-db
    restart: always
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - blog-db-data:/var/lib/postgresql/data
      - ./seed/blog-init-data.sql:/tmp/blog-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blog_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"
    networks:
      - database

  tour-mongo:
    image: mongo:7
    container_name: tour-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - tour-mongo-data:/data/db
    networks:
      - database

  purchase-mongo:
    image: mongo:7
    container_name: purchase-mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - purchase-mongo-data:/data/db
    networks:
      - database

  follower-neo4j:
    image: neo4j:5
    container_name: follower-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - follower-neo4j-data:/data
    networks:
      - database

  stakeholders-service:
    build:
      context: .
      dockerfile: services/stakeholders-service/Dockerfile
      target: final
    container_name: stakeholders-service
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=stakeholders-db;Port=5432;Database=stakeholders_db;Username=postgres;Password=postgres
      Services__FollowerUrl: http://follower-service:8086/
    depends_on:
      stakeholders-db:
        condition: service_healthy
    networks:
      - application
      - database

  blog-service:
    build:
      context: .
      dockerfile: services/blog-service/Dockerfile
      target: final
    container_name: blog-service
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=blog-db;Port=5432;Database=blog_db;Username=postgres;Password=root
      FollowerService__BaseUrl: http://follower-service:8086
      FollowerService__GrpcUrl: http://follower-service:9092
    depends_on:
      blog-db:
        condition: service_healthy
      follower-service:
        condition: service_started
    networks:
      - application
      - database

  tour-service:
    build:
      context: .
      dockerfile: services/tour-service/Dockerfile
    container_name: tour-service
    restart: on-failure
    environment:
      MONGO_URI: mongodb://tour-mongo:27017
      PURCHASE_SERVICE_URL: http://purchase-service:8087
    depends_on:
      - tour-mongo
    networks:
      - application
      - database

  purchase-service:
    build:
      context: .
      dockerfile: services/purchase-service/Dockerfile
    container_name: purchase-service
    restart: on-failure
    environment:
      MONGO_URI: mongodb://purchase-mongo:27017
      TOUR_SERVICE_URL: http://tour-service:8085
      TOUR_SERVICE_GRPC_ADDR: tour-service:9091
    depends_on:
      - purchase-mongo
      - tour-service
    networks:
      - application
      - database

  gateway-rpc-adapter:
    build:
      context: .
      dockerfile: services/gateway-rpc-adapter/Dockerfile
    container_name: gateway-rpc-adapter
    restart: on-failure
    environment:
      PURCHASE_GRPC_ADDR: purchase-service:9093
      FOLLOWER_GRPC_ADDR: follower-service:9092
      TOUR_GRPC_ADDR: tour-service:9094
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      - purchase-service
      - follower-service
      - jaeger
    networks:
      - application
      - monitoring

  follower-service:
    build: ./services/follower-service
    container_name: follower-service
    environment:
      - SPRING_NEO4J_URI=bolt://follower-neo4j:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=password123
    depends_on:
      - follower-neo4j
    networks:
      - application
      - database

  api-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:80"
    depends_on:
      - stakeholders-service
      - blog-service
      - tour-service
      - purchase-service
      - follower-service
      - gateway-rpc-adapter
    networks:
      - application

  tourist-app-ui:
    build:
      context: ./frontend/tourist-app-ui
      dockerfile: Dockerfile
    container_name: tourist-app-ui
    ports:
      - "4200:4200"
    depends_on:
      - api-gateway
    networks:
      - application

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4318:4318"
    networks:
      - monitoring
      - application

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    user: root
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  stakeholders-db-data:
  blog-db-data:
  tour-mongo-data:
  purchase-mongo-data:
  follower-neo4j-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  application:
  database:
  monitoring:
