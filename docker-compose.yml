services:
  stakeholders-db:
    image: postgres:16-alpine
    container_name: stakeholders-db
    restart: always
    environment:
      POSTGRES_DB: stakeholders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - stakeholders-db-data:/var/lib/postgresql/data
      - ./seed/stakeholders-init-data.sql:/tmp/stakeholders-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stakeholders_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    networks:
      - database

  blog-db:
    image: postgres:16-alpine
    container_name: blog-db
    restart: always
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - blog-db-data:/var/lib/postgresql/data
      - ./seed/blog-init-data.sql:/tmp/blog-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blog_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"
    networks:
      - database

  tour-mongo:
    image: mongo:7
    container_name: tour-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - tour-mongo-data:/data/db
    networks:
      - database

  stakeholders-service:
    build:
      context: .
      dockerfile: services/stakeholders-service/Dockerfile
      target: final
    container_name: stakeholders-service
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=stakeholders-db;Port=5432;Database=stakeholders_db;Username=postgres;Password=postgres
    depends_on:
      stakeholders-db:
        condition: service_healthy
    ports:
      - "5001:8080"
    networks:
      - application
      - database

  blog-service:
    build:
      context: .
      dockerfile: services/blog-service/Dockerfile
      target: final
    container_name: blog-service
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=blog-db;Port=5432;Database=blog_db;Username=postgres;Password=root
    depends_on:
      blog-db:
        condition: service_healthy
    ports:
      - "5002:8080"
    networks:
      - application
      - database

  tour-service:
    build:
      context: .
      dockerfile: services/tour-service/Dockerfile
    container_name: tour-service
    restart: on-failure
    environment:
      MONGO_URI: mongodb://tour-mongo:27017
    depends_on:
      - tour-mongo
    ports:
      - "8085:8085"
    networks:
      - application
      - database

  tourist-app-ui:
    build:
      context: ./frontend/tourist-app-ui
      dockerfile: Dockerfile
    container_name: tourist-app-ui
    ports:
      - "4200:4200"
    depends_on:
      - stakeholders-service
      - blog-service
      - tour-service
    networks:
      - application

volumes:
  stakeholders-db-data:
  blog-db-data:
  tour-mongo-data:

networks:
  application:
  database:
