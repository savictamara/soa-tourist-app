<section class="panel">
  <h2>Shopping Cart</h2>
  <p class="panel-text">Review selected published tours and complete checkout.</p>

  <p *ngIf="isLoading" class="state">Loading cart...</p>
  <p *ngIf="!isLoading && cart && cart.items.length === 0" class="state">Your cart is empty.</p>

  <div *ngIf="cart && cart.items.length > 0" class="cart-list">
    <article class="cart-item" *ngFor="let item of cart.items">
      <div>
        <h3>{{ item.tourName }}</h3>
        <p>Tour ID: {{ item.tourId }}</p>
      </div>
      <div class="cart-price">{{ item.price | number:'1.2-2' }}</div>
      <button
        type="button"
        class="secondary-button"
        (click)="removeItem(item.tourId)"
        [disabled]="removingTourId === item.tourId">
        {{ removingTourId === item.tourId ? 'Removing...' : 'Remove' }}
      </button>
    </article>
  </div>

  <div *ngIf="cart" class="cart-summary">
    <strong>Total:</strong>
    <span>{{ cart.totalPrice | number:'1.2-2' }}</span>
  </div>

  <button
    type="button"
    (click)="checkout()"
    [disabled]="isCheckingOut || !cart || cart.items.length === 0">
    {{ isCheckingOut ? 'Checking out...' : 'Checkout' }}
  </button>

  <p *ngIf="successMessage" class="state success">{{ successMessage }}</p>
  <p *ngIf="errorMessage" class="state error">{{ errorMessage }}</p>
</section>
